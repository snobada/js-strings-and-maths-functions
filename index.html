<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript String & Math Functions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>JavaScript String & Math Functions</h1>
    <p>Demonstration of String and Math methods using JavaScript</p>
</header>

<div class="container">

    <div class="card">
        <h2>String Functions</h2>

        <label>Enter a String</label>
        <textarea id="text" rows="4" placeholder="Type your sentence here..."></textarea>

        <label>Word to Search</label>
        <input type="text" id="word" placeholder="Enter a word">

        <button onclick="stringFunctions()">Show Results</button>

        <div id="stringOutput" class="output"></div>
    </div>

    <div class="card">
        <h2>Math Functions</h2>

        <label>Enter Number</label>
        <input type="number" id="number">

        <label>Power</label>
        <input type="number" id="power">

        <button onclick="mathFunctions()">Calculate</button>

        <div id="mathOutput" class="output"></div>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
